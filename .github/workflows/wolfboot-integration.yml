name: wolfBoot Integration

'on':
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WOLFBOOT_REPO: https://github.com/wolfSSL/wolfBoot.git
  WOLFBOOT_BRANCH: master

jobs:
  stm32h5_dice_attestation:
    name: stm32h5-dice-attestation
    if: toLower(github.repository_owner) == 'wolfssl'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/danielinux/m33mu-ci:1.8
    timeout-minutes: 25

    steps:
      - name: Checkout wolfPSA
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4

      - name: Clone wolfBoot and link tested wolfPSA
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git clone --depth 1 --branch "${WOLFBOOT_BRANCH}" "${WOLFBOOT_REPO}" wolfboot
          git -C wolfboot config --global --add safe.directory "${GITHUB_WORKSPACE}/wolfboot"
          git -C wolfboot submodule update --init --recursive
          rm -rf wolfboot/lib/wolfPSA
          ln -s "${GITHUB_WORKSPACE}" wolfboot/lib/wolfPSA
          test -L wolfboot/lib/wolfPSA
          test "$(realpath wolfboot/lib/wolfPSA)" = "${GITHUB_WORKSPACE}"

      - name: Clean build tree for DICE test (stm32h5)
        working-directory: wolfboot
        run: |
          make clean distclean

      - name: Configure DICE test (stm32h5)
        working-directory: wolfboot
        run: |
          cp config/examples/stm32h5-tz-psa.config .config

      - name: Build DICE attestation test (stm32h5)
        working-directory: wolfboot
        run: |
          make

      - name: Run DICE attestation test (stm32h5)
        working-directory: wolfboot
        run: |
          m33mu wolfboot.bin test-app/image_v1_signed.bin:0x60000 \
            --uart-stdout --expect-bkpt 0x7f --timeout 600
